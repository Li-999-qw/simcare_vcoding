<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
#clinical-language-bar{position:static;display:flex;justify-content:flex-end;box-sizing:border-box;width:100%;max-width:1500px;margin:0 auto;padding:12px;clear:both;color-scheme:light}
#clinical-language-bar #clinical-language-switch{position:static!important;inset:auto!important;float:none!important;transform:none!important;display:flex;flex-wrap:wrap;gap:4px;padding:5px;border:1px solid #b7cbcd;border-radius:10px;background:#fff;box-shadow:0 2px 12px #1232;font:14px system-ui;direction:ltr}
#clinical-language-switch a{display:block;padding:8px 14px;color:#174d52;text-decoration:none;border-radius:6px;white-space:nowrap}
#clinical-language-switch a[aria-current="page"]{background:#e5f3f1;font-weight:600}
#clinical-language-switch a:focus-visible{outline:2px solid #116c60;outline-offset:2px}
body:has(.hx-language) #clinical-language-bar{display:none!important}
#clinical-language-bar{display:none!important}
#clinical-roles .hx-mast{flex-wrap:wrap}
#clinical-roles .hx-brand{min-width:0;overflow-wrap:anywhere}
#clinical-roles .hx-language{display:flex;position:static!important;gap:4px;margin-left:auto;padding:5px;border:1px solid #b7cbcd;border-radius:10px;background:#fff;flex-shrink:0;align-self:center}
#clinical-roles .hx-language a{display:block;padding:8px 14px;color:#174d52;text-decoration:none;border-radius:6px;font:14px system-ui;white-space:nowrap}
#clinical-roles .hx-language a[aria-current="page"]{background:#e5f3f1;font-weight:600}
#clinical-roles .hx-columns{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);box-sizing:border-box;max-width:1500px;width:100%;margin-left:auto;margin-right:auto}
#clinical-roles .hx-photo{min-height:0!important;aspect-ratio:942 / 710;align-self:start}
#clinical-roles .hx-photo img{position:absolute!important;width:168.153%!important;height:auto!important;max-width:none!important;left:-3.7155%!important;top:-20.5634%!important}
#clinical-roles .hx-card{min-width:0;box-sizing:border-box}
@media(max-width:700px){#clinical-roles .hx-columns{grid-template-columns:minmax(0,1fr)}#clinical-roles .hx-language{margin-left:auto}}
</style><div id="clinical-language-bar"><nav id="clinical-language-switch" aria-label="Language / 语言">
<a href="/portal.html?ui=language-v3" lang="zh-CN" aria-current="page">中文 · 中文版</a>
<a href="/en/portal.html?ui=language-v3" lang="en" >English · 英文版</a></nav></div>
<script>(()=>{const current="zh";document.querySelectorAll('#clinical-language-switch a').forEach(a=>a.addEventListener('click',e=>{if(a.lang===(current==='en'?'en':'zh-CN')){e.preventDefault();return}if(location.pathname.includes('/training/')&&!confirm(current==='en'?'Switch language and return to the learning platform? Your saved practice is retained. Unsent text will not be transferred.':'切换语言并返回学习平台？已保存的练习会保留，尚未发送的文字不会转移。'))e.preventDefault()}));})();</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>百炼模型配置</title><style>body{font:17px/1.7 system-ui;background:#f3f6fa;color:#243746}main{max-width:700px;margin:50px auto;background:white;padding:32px;border-radius:16px}input{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{padding:10px 18px;margin:16px 8px 0 0;cursor:pointer}#status{white-space:pre-wrap}</style><main><a href="/portal.html">返回管理界面</a><h1>阿里云百炼</h1><p><a href="/admin/models">角色模型、人设编辑与图片对答测试</a></p><p>患者：千问 Flash<br>上级医师与复盘：qwen3.7-plus（支持图片）<br>维吾尔语病例保留原模型。</p><p>请使用中国内地北京地域的 API 密钥。密钥仅在本服务器加密保存，不会回显。语音识别不受此设置影响；上级医师支持文字和图片；患者继续使用 qwen-flash。</p><label>百炼 API 密钥<input id="key" type="password" autocomplete="new-password" placeholder="sk-…"></label><button data-action="save">1. 保存密钥</button><button data-action="test">2. 保存并验证两个模型</button><button data-action="activate">3. 启用 Flash / 视觉 Plus</button><p id="status" role="status"></p></main><script>
const statusBox=document.getElementById('status'), keyInput=document.getElementById('key');
async function call(action,secret){
 const response=await fetch('/admin/api/bailian',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...(secret!==undefined?{api_key:secret}:{})})});
 let data;try{data=await response.json()}catch{throw Error('服务器未返回有效响应（HTTP '+response.status+'），请刷新后重试。')}
 if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'操作未完成（HTTP '+response.status+'）');return data;
}
document.querySelectorAll('button').forEach(button=>button.onclick=async()=>{
 document.querySelectorAll('button').forEach(x=>x.disabled=true);
 try{
  const action=button.dataset.action, secret=keyInput.value.trim();
  if(action==='activate'&&secret)throw Error('输入框内有尚未保存的新密钥，请先点击“保存并验证两个模型”。');
  if(action==='save'||(action==='test'&&secret)){
   statusBox.textContent='正在加密保存密钥…';
   const saved=await call('save',secret);keyInput.value='';statusBox.textContent=saved.message;
  }
  if(action==='test'){
   statusBox.textContent='密钥已保存，正在向阿里云验证患者文字回复及上级医师图片识别，请稍候…';
   statusBox.textContent=(await call('test')).message;
  }else if(action==='activate')statusBox.textContent=(await call('activate')).message;
 }catch(error){statusBox.textContent=error.message}
 finally{document.querySelectorAll('button').forEach(x=>x.disabled=false)}
});
fetch('/admin/api/bailian').then(async response=>{const data=await response.json();if(!response.ok)throw Error(data.detail||'请先登录管理员账号');return data}).then(data=>{if(!keyInput.value)statusBox.textContent=data.active?'当前已启用百炼。':data.configured?'服务器已有加密保存的密钥，可直接验证。':'服务器尚未保存密钥。粘贴后可直接点击“保存并验证两个模型”。'}).catch(error=>statusBox.textContent=error.message);
</script></html>
