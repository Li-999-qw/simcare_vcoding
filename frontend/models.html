<!doctype html><html lang="zh-CN"><script src="/session-guard.js"></script><meta charset="utf-8"><style>
#clinical-language-bar{position:static;display:flex;justify-content:flex-end;box-sizing:border-box;width:100%;max-width:1500px;margin:0 auto;padding:12px;clear:both;color-scheme:light}
#clinical-language-bar #clinical-language-switch{position:static!important;inset:auto!important;float:none!important;transform:none!important;display:flex;flex-wrap:wrap;gap:4px;padding:5px;border:1px solid #b7cbcd;border-radius:10px;background:#fff;box-shadow:0 2px 12px #1232;font:14px system-ui;direction:ltr}
#clinical-language-switch a{display:block;padding:8px 14px;color:#174d52;text-decoration:none;border-radius:6px;white-space:nowrap}
#clinical-language-switch a[aria-current="page"]{background:#e5f3f1;font-weight:600}
#clinical-language-switch a:focus-visible{outline:2px solid #116c60;outline-offset:2px}
body:has(.hx-language) #clinical-language-bar{display:none!important}
#clinical-language-bar{display:none!important}
#clinical-roles .hx-mast{flex-wrap:wrap}
#clinical-roles .hx-brand{min-width:0;overflow-wrap:anywhere}
#clinical-roles .hx-language{display:flex;position:static!important;gap:4px;margin-left:auto;padding:5px;border:1px solid #b7cbcd;border-radius:10px;background:#fff;flex-shrink:0;align-self:center}
#clinical-roles .hx-language a{display:block;padding:8px 14px;color:#174d52;text-decoration:none;border-radius:6px;font:14px system-ui;white-space:nowrap}
#clinical-roles .hx-language a[aria-current="page"]{background:#e5f3f1;font-weight:600}
#clinical-roles .hx-columns{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);box-sizing:border-box;max-width:1500px;width:100%;margin-left:auto;margin-right:auto}
#clinical-roles .hx-photo{min-height:0!important;aspect-ratio:942 / 710;align-self:start}
#clinical-roles .hx-photo img{position:absolute!important;width:168.153%!important;height:auto!important;max-width:none!important;left:-3.7155%!important;top:-20.5634%!important}
#clinical-roles .hx-card{min-width:0;box-sizing:border-box}
@media(max-width:700px){#clinical-roles .hx-columns{grid-template-columns:minmax(0,1fr)}#clinical-roles .hx-language{margin-left:auto}}
</style><div id="clinical-language-bar"><nav id="clinical-language-switch" aria-label="Language / 语言">
<a href="/portal.html?ui=language-v3" lang="zh-CN" aria-current="page">中文 · 中文版</a>
<a href="/en/portal.html?ui=language-v3" lang="en" >English · 英文版</a></nav></div>
<script>(()=>{const current="zh";document.querySelectorAll('#clinical-language-switch a').forEach(a=>a.addEventListener('click',e=>{if(a.lang===(current==='en'?'en':'zh-CN')){e.preventDefault();return}if(location.pathname.includes('/training/')&&!confirm(current==='en'?'Switch language and return to the learning platform? Your saved practice is retained. Unsent text will not be transferred.':'切换语言并返回学习平台？已保存的练习会保留，尚未发送的文字不会转移。'))e.preventDefault()}));})();</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色模型与对答测试</title><style>body{margin:0;background:#f3f6fa;color:#203546;font:16px/1.65 system-ui}main{max-width:1380px;margin:30px auto;padding:0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}section,details.fixed{background:white;padding:24px;border:1px solid #d8e2e8;border-radius:14px}label{display:block;margin:12px 0}input,select,textarea{width:100%;box-sizing:border-box;font:inherit;border:1px solid #adbdc9;border-radius:6px;padding:8px}button{font:inherit;padding:9px 14px;border:0;border-radius:6px;background:#246974;color:white;margin:8px 8px 8px 0;cursor:pointer}button:disabled{opacity:.5}textarea.persona{height:260px}.log{height:260px;overflow:auto;background:#f4f7fa;padding:12px;border-radius:8px}.bubble{white-space:pre-wrap;margin:8px 0;padding:10px;background:white;border-radius:6px}.student{background:#e3f1f2}.muted{color:#607582;font-size:14px}pre{white-space:pre-wrap}#status{white-space:pre-wrap}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style><main><a href="/portal.html">返回管理界面</a> · <a href="/admin/bailian">百炼密钥与连接验证</a><h1>角色模型与对答测试</h1><p>两个角色独立试聊。测试使用下方尚未保存的模型和人设，不写入学生练习。保存后仅影响后续生成的回复。</p><p class="muted">模拟资料：张先生，45岁，搬重物后腰痛3天，无下肢麻木；其他医学事实未设定。图片只作为本次上级医师测试资料。</p><p id="status" role="status">正在加载…</p><div class="grid" id="panels"></div><details class="fixed"><summary>系统固定规则（只读）</summary><p class="muted">病例事实、信息开放范围、考试权限由系统提供。人设编辑不会修改病例库或学生记录。</p><pre id="fixed"></pre></details><details class="fixed"><summary>OpenAI API 密钥管理</summary><input id="openai-key" type="password" placeholder="输入新的 API Key" autocomplete="off"><button id="save-key">保存密钥</button><button id="check-key">验证连接</button></details></main><script>
const statusBox=document.getElementById('status'),roles=['patient','senior'];let revision=0,promptRevision=0,current={},histories={patient:[],senior:[]};const el=id=>document.getElementById(id);
for(const role of roles){const label=role==='patient'?'患者':'上级医师';const section=document.createElement('section');section.innerHTML=`<h2>${label}对答测试</h2><label>调用方式<select id="${role}-provider"><option value="bailian">阿里云百炼</option><option value="codex">Codex 登录连接</option><option value="openai">OpenAI API</option></select></label><label>模型标识<input id="${role}-model" list="model-list"></label><label>Codex 推理强度<select id="${role}-effort"><option>low</option><option>none</option><option>minimal</option><option>medium</option><option>high</option></select></label><button data-save-model="${role}">保存此角色模型</button><details open><summary>${label}人设提示词（可编辑）</summary><textarea class="persona" id="${role}-persona" maxlength="16000"></textarea><button data-save-prompt="${role}">保存人设到正式训练</button><p class="muted">可直接修改后在下面试聊；未点击保存前，不影响正式训练。</p></details><div class="log" id="${role}-log" aria-live="polite"></div>${role==='senior'?'<label>测试图片（PNG/JPEG，最多8MB）<input id="senior-image" type="file" accept="image/png,image/jpeg"></label><button id="clear-image">移除图片</button>':''}<label>向${label}提问<textarea id="${role}-question" rows="3" maxlength="2000"></textarea></label><button data-send="${role}">发送测试</button><button data-clear="${role}">清空此角色对话</button><p id="${role}-result" role="status" class="muted"></p>`;el('panels').append(section)}
const list=document.createElement('datalist');list.id='model-list';for(const name of ['qwen-flash','qwen3.7-plus','qwen3.8-flash','qwen3-vl-plus','qwen-plus','gpt-6-astra']){const option=document.createElement('option');option.value=name;list.append(option)}document.body.append(list);
async function api(path,data){const r=await fetch(path,{cache:'no-store',...(data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{})});let d;try{d=await r.json()}catch{throw Error('服务器响应异常，请重试')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'输入格式不正确');return d}
function choice(role){return{provider:el(role+'-provider').value,model:el(role+'-model').value.trim(),effort:el(role+'-effort').value}}
function draw(role){const log=el(role+'-log');log.replaceChildren();for(const m of histories[role]){const node=document.createElement('div');node.className='bubble '+m.speaker;node.textContent=(m.speaker==='student'?'你：':'角色：')+m.text;log.append(node)}log.scrollTop=log.scrollHeight}
async function imageData(){const file=el('senior-image').files[0];if(!file)return null;if(file.size>8*1024*1024)throw Error('图片不能超过8MB');return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('图片读取失败'));reader.readAsDataURL(file)})}
document.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;let role=b.dataset.clear;if(role){histories[role]=[];draw(role);return}if(b.id==='clear-image'){el('senior-image').value='';return}b.disabled=true;try{if(b.id==='save-key'){await api('/admin/api/models/credential',{api_key:el('openai-key').value,action:'save'});el('openai-key').value='';statusBox.textContent='密钥已保存。'}else if(b.id==='check-key'){statusBox.textContent=(await api('/admin/api/models/credential/check',{})).message;}else if(role=b.dataset.saveModel){const data=await api('/admin/api/models',{revision,...current,[role]:choice(role)});revision=data.revision;current={patient:data.patient,senior:data.senior};statusBox.textContent='该角色模型已保存，后续对话生效。'}else if(role=b.dataset.savePrompt){const data=await api('/admin/api/role-prompts',{revision:promptRevision,role,text:el(role+'-persona').value});promptRevision=data.revision;statusBox.textContent='该角色人设已保存，后续对话生效。'}else if(role=b.dataset.send){const text=el(role+'-question').value.trim();if(!text)return;el(role+'-result').textContent='正在测试…';const data=await api('/admin/api/models/test',{role,config:choice(role),persona:el(role+'-persona').value,text,history:histories[role].slice(-20),image_data:role==='senior'?await imageData():null});histories[role].push({speaker:'student',text},{speaker:'assistant',text:data.reply});el(role+'-question').value='';draw(role);el(role+'-result').textContent='模型：'+data.timing.model+' · '+data.timing.total_seconds+' 秒'}}catch(error){statusBox.textContent=error.message;if(role)el(role+'-result').textContent=error.message}finally{b.disabled=false}});
Promise.all([api('/admin/api/models'),api('/admin/api/role-prompts')]).then(([models,prompts])=>{revision=models.revision;promptRevision=prompts.revision;current={patient:models.patient,senior:models.senior};for(const role of roles){for(const field of ['provider','model','effort'])el(role+'-'+field).value=models[role][field];el(role+'-persona').value=prompts[role]}el('fixed').textContent=prompts.fixed_rules;statusBox.textContent='已加载当前模型和人设。'}).catch(error=>statusBox.textContent=error.message+'。请先登录管理员账号。');
</script></html>
